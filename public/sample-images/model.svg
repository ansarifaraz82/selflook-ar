<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" width="300" height="600">
  <!-- Background -->
  <rect width="300" height="600" fill="#f5f5f5"/>
  
  <!-- Head -->
  <circle cx="150" cy="80" r="40" fill="#d9a574"/>
  
  <!-- Hair -->
  <path d="M 110 80 Q 110 40 150 30 Q 190 40 190 80" fill="#3d2817"/>
  <ellipse cx="150" cy="45" rx="35" ry="20" fill="#3d2817"/>
  
  <!-- Neck -->
  <rect x="140" y="115" width="20" height="15" fill="#d9a574"/>
  
  <!-- Shirt (placeholder for garment) -->
  <rect x="100" y="130" width="100" height="120" fill="#4a90e2" rx="5"/>
  <rect x="100" y="130" width="50" height="120" fill="#4a90e2" rx="5"/>
  <rect x="150" y="130" width="50" height="120" fill="#4a90e2" rx="5"/>
  
  <!-- Sleeves -->
  <rect x="80" y="130" width="20" height="80" fill="#d9a574" rx="10"/>
  <rect x="200" y="130" width="20" height="80" fill="#d9a574" rx="10"/>
  
  <!-- Hands -->
  <circle cx="75" cy="200" r="12" fill="#d9a574"/>
  <circle cx="225" cy="200" r="12" fill="#d9a574"/>
  
  <!-- Pants -->
  <rect x="110" y="250" width="35" height="120" fill="#2c3e50"/>
  <rect x="155" y="250" width="35" height="120" fill="#2c3e50"/>
  
  <!-- Shoes -->
  <ellipse cx="127" cy="380" rx="15" ry="12" fill="#1a1a1a"/>
  <ellipse cx="173" cy="380" rx="15" ry="12" fill="#1a1a1a"/>
  
  <!-- Eyes -->
  <circle cx="135" cy="75" r="4" fill="#000"/>
  <circle cx="165" cy="75" r="4" fill="#000"/>
  
  <!-- Mouth -->
  <path d="M 135 90 Q 150 95 165 90" stroke="#c2654d" stroke-width="2" fill="none"/>
</svg>
